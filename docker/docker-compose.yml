services:

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile

    container_name: dr-postgres

    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      WALG_S3_PREFIX: s3://${POSTGRES_DB}-backups/wal
      WALG_S3_FORCE_PATH_STYLE: "true"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    depends_on:
      - rustfs

    networks:
      - dr-net


  rustfs:
    image: rustfs/rustfs:latest

    container_name: dr-rustfs

    restart: unless-stopped

    ports:
      - "9000:9000"

    volumes:
      - rustfs_data:/data

    networks:
      - dr-net


  sync:
    build:
      context: .
      dockerfile: ./sync/Dockerfile

    container_name: dr-sync

    restart: unless-stopped

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: eu-central-1

    volumes:
      - ../src:/app/src
      - ./sync/jobs.json:/app/src/jobs.json:ro
      - ./configs/rclone:/root/.config/rclone

    working_dir: /app/src

    command: python sync_manager.py

    depends_on:
      - rustfs

    networks:
      - dr-net


volumes:
  postgres_data:
  rustfs_data:

networks:
  dr-net:
    driver: bridge